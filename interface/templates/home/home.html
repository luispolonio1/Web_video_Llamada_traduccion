{% extends 'home/base.html' %} {% load static %} 
{% block title %}Inicio{%endblock %} 

{% block head %}

<link
      rel="preload"
      href="{% static 'js/hands/hands_solution_packed_assets_loader.js' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands_solution_packed_assets.data' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands_solution_simd_wasm_bin.js' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands_solution_simd_wasm_bin.wasm' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands_solution_wasm_bin.js' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands_solution_wasm_bin.wasm' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hand_landmark_full.tflite' %}"
      as="fetch"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="{% static 'js/hands/hands.js' %}"
      as="fetch"
      crossorigin="anonymous"
    />
{% endblock head%}

{% block content %}
<div class="h-full flex flex-col">
    <!-- Header -->
    <div class="flex justify-between mb-3">
        <div>
            <h1 class="text-white text-2xl font-bold font-sans">Bienvenido {{ user }}</h1>
            <p id="fecha" class="text-gray-400"></p>
        </div>
        <ul class="space-y-2">
            <li class="relative">
                <button 
                id="btn-solicitudes"
                class="flex justify-between items-center p-2 hover:bg-gray-700 rounded relative"
                >
                <i class="fa-solid fa-user-plus text-lg text-white"></i>
                <span id="contador-solicitudes" 
                    class="hidden absolute top-0 right-0 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transform translate-x-1/2 -translate-y-1/2">
                    0
                </span>
                </button>

                <ul id="SolicitudesPorAceptar"
                class="hidden absolute top-full right-0 mt-2 bg-gray-800 rounded-lg shadow-lg min-w-[320px] max-h-[400px] overflow-y-auto z-50 border border-gray-700">
                <!-- Se insertarán aquí las solicitudes -->
                </ul>
            </li>
            
        </ul>
    </div>

    <!-- Grid con 2 columnas -->
    <div class="grid grid-cols-2 gap-4 flex-1 min-h-0">

        <!-- Columna izquierda (dos videos apilados) -->
        <div class="flex flex-col gap-4 min-h-0">
            <video 
                id="video-local" 
                class="bg-gray-700 rounded-lg flex-1 object-cover w-full min-h-0" 
                autoplay 
                playsinline 
                muted>
                Tu navegador no soporta el video.
            </video>

            <video 
                id="video-remoto" 
                class="bg-gray-700 rounded-lg flex-1 object-cover w-full min-h-0" 
                autoplay 
                playsinline>
                Tu navegador no soporta el video.
            </video>
        </div>

        <!-- Columna derecha (video grande) -->
        <div id="video-area"  class="relative w-full h-full">
    <!-- Video -->
    <video 
        id="video-compartido" 
        class="bg-gray-700 rounded-lg w-full h-full object-cover" 
        autoplay 
        playsinline>
        Tu navegador no soporta el video.
    </video>

    <!-- Botón para abrir el overlay (flotante sobre el video) -->
    <button 
        id="btn-abrir-overlay"
        onclick="document.getElementById('overlay-panel').classList.remove('hidden')"
        class="absolute top-4 right-4 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg transition z-20">
        <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <!-- Div superpuesto (overlay) -->
    <div 
        id="overlay-panel"
        class="hidden absolute inset-0 bg-sky-950 backdrop-blur-sm rounded-lg z-30 p-6 overflow-y-auto">
        
        <!-- Botón de cerrar -->
        <button 
            onclick="document.getElementById('overlay-panel').classList.add('hidden')"
            class="absolute top-4 right-4 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full transition">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <!-- Contenido del overlay -->
       <div class="flex flex-col h-full p-6" id ="conversacion" >
            <h2 class="text-2xl font-bold mb-4 text-white">Coversacion</h2>

             <div id="mensajes-chat" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-4">

                
             </div>

        </div>
    </div>
</div>
</div>

    <!-- Botones de control -->
    <div class="hidden flex justify-center gap-6 mt-3" id="Botones">
        <button class="bg-red-600 hover:bg-red-700 text-white font-semibold p-4 rounded-full flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-phone-slash text-lg"></i>
        </button>

        <button id="toggleProcessing" onclick="toggleProcessing()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold p-4 rounded-full flex items-center justify-center transition shadow-md" title="Iniciar procesamiento" aria-label="Iniciar procesamiento" disabled>
            <i class="fa-solid fa-language text-lg"></i>
        </button>

        <button class="bg-green-600 hover:bg-green-700 text-white font-semibold p-4 rounded-full flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-video text-lg"></i>
        </button>

        <button class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold p-4 rounded-full flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-volume-high text-lg"></i>
        </button>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  window.CURRENT_USER = "{{ user }}";
</script>
<script src="{% static 'js/Home/Fecha.js' %}"></script>
<script type="module" src="{% static 'js/Videollamada/llamada.js' %}"></script>
<script src="{% static 'js/modelo/model.js' %}"></script>
<script defer src="{% static 'js/hands/hands.js' %}" crossorigin="anonymous"></script>
<script  src="{% static 'js/AudioSignModule.js' %}"></script>
<script  src="{% static 'js/Home/SolicitudesGet.js' %}"></script>
{% endblock scripts %}
